[plugin]

name="dot-voice"
description="Voice chat for Godot 4. Microphone capture with push-to-talk or voice activation, a pluggable codec, one jitter buffer per speaker, server-side routing to everybody, a team or a radius, and mute enforcement on the server rather than on the client that is being muted."
author="dot"
version="0.1.0"
script="dot_voice_plugin.gd"
